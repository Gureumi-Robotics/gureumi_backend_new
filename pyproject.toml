[project]
name = "gureumi-backend-new"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
